<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>てんぷら職人</title>
  <meta name="description" content="泡と音で揚げ頃を見極め、てんぷらをカラッと揚げる3Dゲーム" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="chip"><span class="k">残り</span><span id="time">2:30</span></div>
      <div class="chip"><span class="k">売上</span><span id="score">0</span></div>
      <button id="btn-pause" class="ghost" title="一時停止">❚❚</button>
    </div>

    <div id="warn" class="hidden"></div>

    <div id="bottombar">
      <div id="ingredients"></div>
    </div>
    <div id="hint">吹き出しの具材を選んで鍋へ。天ぷらを<b>タップで裏返し</b>、揚がったら<b>右の網までドラッグ</b>して引き上げる。</div>
    <div id="rack-hint">ここで離すと網に上げる</div>
  </div>

  <!-- 評価ポップアップ -->
  <div id="toasts"></div>

  <!-- タイトル -->
  <div id="title" class="overlay">
    <div class="card">
      <h1>てんぷら職人</h1>
      <p class="sub">油の音を聴き、泡を見て、カラッと揚げろ。</p>
      <div class="modes">
        <button class="primary" data-mode="shift">営業開始（2分30秒）</button>
        <a class="btn" href="howto.html">遊び方</a>
      </div>
      <label class="check"><input type="checkbox" id="opt-master" /> 職人モード：揚げ時間を隠す（得点 ×1.3）</label>
      <label class="check"><input type="checkbox" id="opt-bgm" checked /> BGM（バッハ 平均律 前奏曲 ハ長調）</label>
      <p class="tiny">音が出ます。</p>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="card small">
      <h2>一時停止</h2>
      <div class="modes">
        <button class="primary" id="btn-resume">再開</button>
        <button id="btn-quit">タイトルへ</button>
      </div>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div class="card">
      <h2>本日の営業終了</h2>
      <div id="rank"></div>
      <div id="result-body"></div>
      <div class="modes">
        <button class="primary" data-mode="shift">もう一度</button>
        <button id="btn-title">タイトルへ</button>
      </div>
    </div>
  </div>

  <div id="loading" class="overlay"><div class="spinner"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
